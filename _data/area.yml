features:
- name: OAuth 2.0 Protocol Coverage
  description: Comprehensive coverage of OAuth 2.0 authorization framework implementations
    from cloud providers, open source projects, and commercial platforms.
- name: OpenID Connect Providers
  description: Index of OpenID Connect certified identity providers and implementations
    spanning cloud, on-premises, and self-hosted deployments.
- name: Multi-Factor Authentication
  description: Coverage of MFA solutions including TOTP, SMS, push notification, WebAuthn/FIDO2,
    and hardware token implementations.
- name: Self-Hosted Identity Solutions
  description: Open source identity servers that can be self-hosted including Keycloak,
    Authelia, Authentik, Zitadel, and Casdoor.
- name: Enterprise Identity Providers
  description: Commercial enterprise IAM platforms including Okta, Auth0, ForgeRock,
    Ping Identity, and Microsoft Entra ID.
- name: Secrets and PAM
  description: Privileged access management and secrets management tools including
    HashiCorp Vault and CyberArk for secure credential storage.
use_cases:
- name: Identity Provider Selection
  description: Compare authentication platforms across self-hosted, cloud, and enterprise
    tiers to select the right identity provider.
- name: SSO Implementation
  description: Find SSO platforms and libraries for implementing single sign-on across
    applications and services.
- name: API Security Research
  description: Research authentication standards, security patterns, and best practices
    for securing REST, GraphQL, and gRPC APIs.
- name: Zero Trust Architecture
  description: Discover identity verification services for zero trust network access
    and continuous authentication architectures.
integrations:
- name: OAuth 2.0 Standard
  description: The foundational authorization framework implemented by every provider
    in this collection.
- name: OpenID Connect Standard
  description: Identity layer on top of OAuth 2.0 providing standardized user info,
    ID tokens, and discovery endpoints.
- name: SAML 2.0 Standard
  description: XML-based authentication standard widely used for enterprise SSO and
    federation scenarios.
- name: SCIM 2.0 Standard
  description: System for Cross-domain Identity Management for automated user provisioning
    and deprovisioning.
- name: FIDO2/WebAuthn Standard
  description: Web Authentication standard for passwordless and hardware-backed authentication.
