meta:
  name: Authentication
  description: A curated index of services, tooling, and open source solutions for
    API authentication, authorization, identity management, and secrets management.
    This collection covers identity providers, SSO platforms, privileged access management,
    MFA, open source identity servers, and authentication standards including OAuth
    2.0, OpenID Connect, SAML 2.0, FIDO2/WebAuthn, and SCIM.
  tags:
  - Authentication
  - Authorization
  - Identity
  - MFA
  - OAuth
  - OpenID Connect
  - SAML
  - Security
  - SSO
  portal: null
  github: null
  repo: authentication
